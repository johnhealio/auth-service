name: Dependency Audit

on:
  push:
    branches: [main]
  schedule:
    # Weekly — catches new RustSec advisories against an unchanged
    # Cargo.lock, not just new pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
