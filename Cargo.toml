[package]
name = "auth-service"
version = "0.4.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
firestore = { version = "0.50.0", features = ["default"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
# Pinned to match the versions jsonwebtoken's rust_crypto backend already
# pulls in transitively, so there's one copy in the build, not two.
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
pkcs8 = "=0.10.2"
tower = { version = "0.5.3", features = ["util"] }
